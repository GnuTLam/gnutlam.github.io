# Build & deploy to GitHub Pages on every push to main.
# One-time setup on GitHub (see README → Deploy):
#   1. The repository must be named <username>.github.io — the site is served
#      from the root of its domain (BASE_PATH other than / fails the build).
#   2. Settings → Pages → Source: "GitHub Actions"
#   3. (Optional) Settings → Secrets and variables → Actions → Variables:
#      SITE_URL = a custom domain origin (default: site.url in blog.config.ts)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
